<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="logo.png">
    <title>Toko Faster's Scanning System</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        :root {
            --primary-green: #5b6e3d; /* Hijau Utama POS */
            --light-green: #eef2e6; /* Latar Belakang Kotak Harga */
            --bg-accent: #cad5b9; /* Border & Detail */
            --text-dark: #334155;
            --text-sub: #64748b;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-image: url('https://i.pinimg.com/1200x/be/24/be/be24be57ec2fe790126cf56ac20d693e.jpg'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Navbar Atas */
        .navbar {
            background-color: var(--primary-green);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.8rem 3rem;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }

        .navbar .logo-area img {
            height: 45px;
            border-radius: 50%;
        }

        .navbar .nav-links {
            display: flex;
            gap: 2.5rem;
        }

        .navbar .nav-links a {
            color: #ffffff;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.05rem;
            transition: opacity 0.2s;
        }

        .navbar .nav-links a:hover {
            opacity: 0.8;
        }

        /* Container Utama */
        .wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .main-card {
            background-color: #ffffff;
            border-radius: 2rem;
            width: 100%;
            max-width: 1000px;
            padding: 2.5rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 3rem;
            position: relative;
        }

        /* STATUS BADGE ABSOLUTE DI ATAS CARD */
        .status-badge {
            position: absolute;
            top: -15px;
            left: 40px;
            background-color: #f0fdf4;
            color: #166534;
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 700;
            border: 2px solid #bbf7d0;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .status-badge.offline {
            background-color: #fee2e2;
            color: #991b1b;
            border-color: #fecaca;
        }

        /* SISI KIRI: SCANNER AREA */
        .left-panel {
            display: flex;
            flex-direction: column;
        }

        .left-panel h2 {
            font-size: 1.6rem;
            font-weight: 800;
            margin: 0 0 0.5rem 0;
        }

        .left-panel hr {
            border: none;
            height: 2px;
            background-color: #cbd5e1;
            margin-bottom: 1.5rem;
        }

        .field-label {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.8rem;
        }

        /* Scanner Area Gede Sesuai Request */
        .scanner-box {
            flex: 1;
            min-height: 250px;
            border: 2px solid var(--primary-green);
            border-radius: 12px;
            background-color: #ffffff;
            padding: 15px;
            font-size: 1.5rem;
            font-weight: 700;
            text-align: center;
            resize: none;
            outline: none;
            box-sizing: border-box;
            transition: box-shadow 0.2s;
        }

        .scanner-box:focus {
            box-shadow: 0 0 0 4px rgba(91, 110, 61, 0.2);
        }

        .scan-btn {
            background-color: var(--primary-green);
            color: white;
            border: none;
            padding: 1rem;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            margin-top: 1.5rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .scan-btn:hover {
            background-color: #4a5a32;
        }

        /* SISI KANAN: RESULT DISPLAY */
        .right-panel {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .product-title {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--primary-green);
            text-align: right;
            margin-bottom: 1.5rem;
            min-height: 2.4rem;
        }

        .price-row {
            margin-bottom: 1.2rem;
        }

        .price-row.half {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .label-text {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 0.4rem;
        }

        /* Desain Kotak Harga Sesuai Screenshot */
        .display-box {
            background-color: var(--light-green);
            border: 2px solid rgba(91, 110, 61, 0.15);
            border-radius: 16px;
            padding: 1rem;
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--primary-green);
            text-align: center;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
            transition: all 0.2s;
        }

        /* Penanda jika box itu merupakan prioritas hasil scan (Eceran/Grosir) */
        .display-box.active-scan {
            border-color: var(--primary-green);
            background-color: #e2ebda;
            transform: scale(1.02);
        }

        .sku-tag {
            text-align: right;
            font-family: monospace;
            color: var(--text-sub);
            margin-top: 1rem;
            font-size: 0.9rem;
        }

        /* Footer Copyright */
        .footer-tag {
            position: absolute;
            bottom: -55px;
            right: 0;
            background-color: var(--primary-green);
            color: #ffffff;
            padding: 6px 16px;
            border-radius: 10px;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.05em;
        }

        /* Tampilan Awal Sebelum di Scan */
        .idle-state {
            color: var(--text-sub);
            font-style: italic;
            font-size: 1.3rem;
            text-align: center;
            padding: 4rem 0;
        }
    </style>
</head>
<body>

<div class="navbar">
    <div class="logo-area">
        <img src="https://i.pinimg.com/736x/26/ce/86/26ce8634c0cac362ca9b33dea6e2b527.jpg" alt="Logo">
    </div>
    <div class="nav-links">
        <a href="#">Home</a>
        <a href="#">Cashier</a>
        <a href="#">Inspect</a>
    </div>
</div>

<div class="wrapper">
    <div class="main-card">
        <div id="status" class="status-badge offline">Menghubungkan...</div>
        
        <div class="left-panel">
            <h2>Kasir (POS Scanner)</h2>
            <hr>
            <div class="field-label">Scanner area</div>
            
            <textarea id="scanInput" class="scanner-box" placeholder="KLIK DI SINI / LANGSUNG SCAN BARCODE BARANG..."></textarea>
            
            <button class="scan-btn" id="manualScanBtn">Scan</button>
        </div>

        <div class="right-panel">
            <div id="idleMsg" class="idle-state">
                Silakan lakukan *scanning* produk...
            </div>

            <div id="resultDisplay" style="display: none;">
                <div class="product-title" id="pName">Item's name - Brand name</div>
                
                <div class="price-row">
                    <div class="label-text" id="label1">Eceran 1</div>
                    <div class="display-box" id="val1">Rp0</div>
                </div>

                <div class="price-row">
                    <div class="label-text" id="label2">Eceran 2</div>
                    <div class="display-box" id="val2">Rp0</div>
                </div>

                <div class="price-row half">
                    <div>
                        <div class="label-text" id="label3">Grosir 1</div>
                        <div class="display-box" id="val3">RpXXXXXX</div>
                    </div>
                    <div>
                        <div class="label-text" id="label4">Grosir 2</div>
                        <div class="display-box" id="val4">RpXXXXXX</div>
                    </div>
                </div>

                <div class="sku-tag" id="pCode">SCAN CODE: -</div>
            </div>
        </div>

        <div class="footer-tag">TGOS HELPER © ALL RIGHTS RESERVED 2026</div>
    </div>
</div>

<script>
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQqFjmQEMLJl-UhiBkV6hDmVePKMGhWgUkwqPWiUOcv6YeBjX9-mw75au_WztJIkcbwr0D2hcDAGZrw/pub?gid=0&single=true&output=csv";
    let inventoryData = [];

    function initApp() {
        Papa.parse(CSV_URL, {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
                inventoryData = results.data;
                const statusBadge = document.getElementById('status');
                statusBadge.innerText = "✅ DATABASE POS ONLINE: " + inventoryData.length + " ITEM";
                statusBadge.classList.remove('offline');
            },
            error: function() {
                const statusBadge = document.getElementById('status');
                statusBadge.innerText = "❌ GAGAL SINKRONISASI DATABASE";
                statusBadge.classList.add('offline');
            }
        });
    }

    const inputField = document.getElementById('scanInput');
    const displayArea = document.getElementById('resultDisplay');
    const idleMsg = document.getElementById('idleMsg');
    const manualBtn = document.getElementById('manualScanBtn');

    // Proses input dari scanner (Membaca event Enter)
    inputField.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            e.preventDefault(); // Mencegah baris baru di textarea
            processScan();
        }
    });

    // Tombol manual 'Scan' juga bisa diklik jika dibutuhkan
    manualBtn.addEventListener('click', () => {
        processScan();
    });

    function processScan() {
        const barcodeVal = inputField.value.trim();
        if (barcodeVal) {
            searchProduct(barcodeVal);
        }
        inputField.value = ''; // Reset scanner box area
    }

    function searchProduct(barcode) {
        if (inventoryData.length === 0) {
            alert("Database sedang memuat data, mohon tunggu.");
            return;
        }

        const product = inventoryData.find(item => 
            (item['kode jamak'] && String(item['kode jamak']).trim() === barcode) || 
            (item['kode tunggal'] && String(item['kode tunggal']).trim() === barcode)
        );

        if (product) {
            idleMsg.style.display = 'none';
            displayArea.style.display = 'block';
            document.getElementById('pName').innerText = product['nama produk'];
            document.getElementById('pCode').innerText = "KODE BARCODE: " + barcode;

            const isJamak = product['kode jamak'] && String(product['kode jamak']).trim() === barcode;

            // Reset highlight effect dahulu
            removeHighlights();

            if (isJamak) {
                // JIKA SCAN KODE JAMAK (GROSIR)
                // Kotak baris atas diisi data Grosir 1 & Grosir 2
                fillPrice("Grosir 1", product['grosir 1'], 
                          "Grosir 2", product['grosir 2'], 
                          "Eceran 1", product['eceran 1'], 
                          "Eceran 2", product['eceran 2']);
                
                // Tambahkan efek highlight aktif ke kotak baris atas (Grosir)
                document.getElementById('val1').parentElement.classList.add('active-scan');
                document.getElementById('val2').parentElement.classList.add('active-scan');
            } else {
                // JIKA SCAN KODE TUNGGAL (ECERAN)
                // Kotak baris atas diisi data Eceran 1 & Eceran 2
                fillPrice("Eceran 1", product['eceran 1'], 
                          "Eceran 2", product['eceran 2'], 
                          "Grosir 1", product['grosir 1'], 
                          "Grosir 2", product['grosir 2']);
                
                // Tambahkan efek highlight aktif ke kotak baris atas (Eceran)
                document.getElementById('val1').parentElement.classList.add('active-scan');
                document.getElementById('val2').parentElement.classList.add('active-scan');
            }
        } else {
            alert("Kode (" + barcode + ") tidak terdaftar di database Toko Faster.");
        }
    }

    function fillPrice(l1, v1, l2, v2, l3, v3, l4, v4) {
        document.getElementById('label1').innerText = l1;
        document.getElementById('val1').innerText = formatRupiah(v1);
        document.getElementById('label2').innerText = l2;
        document.getElementById('val2').innerText = formatRupiah(v2);
        document.getElementById('label3').innerText = l3;
        document.getElementById('val3').innerText = formatRupiah(v3);
        document.getElementById('label4').innerText = l4;
        document.getElementById('val4').innerText = formatRupiah(v4);
    }

    function removeHighlights() {
        const boxes = document.querySelectorAll('.display-box');
        boxes.forEach(box => box.classList.remove('active-scan'));
    }

    function formatRupiah(angka) {
        if (angka === undefined || angka === null || angka === "") return "Rp-";
        let strAngka = String(angka).replace(/[^0-9]/g, '');
        if (!strAngka) return "Rp0";
        return "Rp" + strAngka.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    }

    // Auto focus lock ke Scanner Area yang besar agar user tinggal scan saja tanpa klik-klik lagi
    document.addEventListener('click', (e) => {
        if(e.target !== manualBtn) {
            inputField.focus();
        }
    });
    
    initApp();
</script>

</body>
</html>
