<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="FASTER.png">
    <title>Toko Faster's Scanning System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        :root {
            --primary-green: #5b6e3d;
            --light-green: #eef2e6;
            --bg-accent: #cad5b9;
            --text-dark: #1e293b;
            --text-sub: #64748b;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: #f4f7f0;
            background-image: 
                linear-gradient(90deg, rgba(91, 110, 61, 0.07) 50%, transparent 50%),
                linear-gradient(rgba(91, 110, 61, 0.07) 50%, transparent 50%);
            background-size: 40px 40px;
        }
        
        /* Container Utama */
        .wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .main-card {
            background-color: #ffffff;
            border-radius: 2rem;
            width: 100%;
            max-width: 1000px;
            padding: 2.5rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.08);
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 3rem;
            position: relative;
            box-sizing: border-box;
        }

        /* Status Badge */
        .status-badge {
            position: absolute;
            top: -15px;
            left: 40px;
            background-color: #f0fdf4;
            color: #166534;
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 700;
            border: 2px solid #bbf7d0;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .status-badge.offline {
            background-color: #fee2e2;
            color: #991b1b;
            border-color: #fecaca;
        }

        /* SISI KIRI */
        .left-panel {
            display: flex;
            flex-direction: column;
        }

        .left-panel h2 {
            font-size: 1.6rem;
            font-weight: 800;
            margin: 0 0 0.5rem 0;
            letter-spacing: -0.02em;
        }

        .left-panel hr {
            border: none;
            height: 2px;
            background-color: #cbd5e1;
            margin-bottom: 1.5rem;
        }

        .field-label {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.8rem;
        }

        .scanner-box {
            font-family: 'Inter', sans-serif;
            flex: 1;
            min-height: 250px;
            border: 2px solid var(--primary-green);
            border-radius: 12px;
            background-color: #ffffff;
            padding: 90px 20px 20px 20px;
            font-size: 1.4rem;
            font-weight: 700;
            text-align: center;
            resize: none;
            outline: none;
            overflow: hidden;
            box-sizing: border-box;
            transition: box-shadow 0.2s;
        }

        .scanner-box:focus { box-shadow: 0 0 0 4px rgba(91, 110, 61, 0.2); }

        .scan-btn {
            font-family: 'Inter', sans-serif;
            background-color: var(--primary-green);
            color: white;
            border: none;
            padding: 1rem;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            margin-top: 1rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .scan-btn:hover { background-color: #4a5a32; }

        /* FITUR BARU: MANUAL SEARCH UI */
        .search-container {
            position: relative;
            margin-top: 1rem;
        }

        .manual-search-input {
            width: 100%;
            font-family: 'Inter', sans-serif;
            padding: 0.8rem 1rem;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 0.95rem;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        .manual-search-input:focus {
            border-color: var(--primary-green);
            box-shadow: 0 0 0 3px rgba(91, 110, 61, 0.1);
        }

        .dropdown-content {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background-color: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            margin-top: 4px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 100;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .dropdown-item {
            padding: 0.8rem 1rem;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            border-bottom: 1px solid #f1f5f9;
        }

        .dropdown-item:last-child { border-bottom: none; }
        .dropdown-item:hover { background-color: var(--light-green); }

        /* SISI KANAN */
        .right-panel {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .product-title {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--primary-green);
            text-align: right;
            margin-bottom: 1.5rem;
            min-height: 2.4rem;
            letter-spacing: -0.01em;
        }

        .price-row { margin-bottom: 1.2rem; }

        .price-row.half {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .label-text {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 0.4rem;
        }

        .display-box {
            background-color: var(--light-green);
            border: 2px solid rgba(91, 110, 61, 0.15);
            border-radius: 16px;
            padding: 1rem;
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--primary-green);
            text-align: center;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
            transition: all 0.2s;
            letter-spacing: -0.02em;
        }

        .display-box.active-scan {
            border-color: var(--primary-green);
            background-color: #e2ebda;
            transform: scale(1.02);
        }

        .sku-tag {
            text-align: right;
            font-family: monospace;
            color: var(--text-sub);
            margin-top: 1rem;
            font-size: 0.9rem;
        }

        .idle-state {
            color: var(--text-sub);
            font-style: italic;
            font-size: 1.3rem;
            text-align: center;
            padding: 4rem 0;
        }

        /* FLOATING FOOTER */
        .floating-footer {
            position: fixed; 
            bottom: 1rem; 
            left: 50%; 
            transform: translateX(-50%); 
            z-index: 50; 
            pointer-events: none; 
            background-color: rgba(91, 110, 61, 0.85); 
            color: #ffffff; 
            padding: 0.5rem 1.5rem; 
            border-radius: 9999px; 
            font-weight: 700; 
            font-size: 0.875rem; 
            letter-spacing: 0.05em; 
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.2); 
        }
    </style>
</head>
<body>
<div class="wrapper">
    <div class="main-card">
        <div id="status" class="status-badge offline">Menghubungkan...</div>
        
        <div class="left-panel">
            <h2>Kasir (POS Scanner)</h2>
            <hr>
            <div class="field-label">Scanner area</div>
            
            <textarea id="scanInput" class="scanner-box" placeholder="KLIK DI SINI / LANGSUNG SCAN BARCODE BARANG..."></textarea>
            
            <div class="search-container">
                <input type="text" id="nameSearch" class="manual-search-input" placeholder="Ketik nama barang..." autocomplete="off">
                <div id="dropdownList" class="dropdown-content">
                </div>
            </div>

            <button class="scan-btn" id="manualScanBtn">Scan</button>
        </div>

        <div class="right-panel">
            <div id="idleMsg" class="idle-state">
                Silakan lakukan *scanning* produk...
            </div>

            <div id="resultDisplay" style="display: none;">
                <div class="product-title" id="pName">Item's name - Brand name</div>
                
                <div class="price-row">
                    <div class="label-text" id="label1">Eceran 1</div>
                    <div class="display-box" id="val1">Rp0</div>
                </div>

                <div class="price-row">
                    <div class="label-text" id="label2">Eceran 2</div>
                    <div class="display-box" id="val2">Rp0</div>
                </div>

                <div class="price-row half">
                    <div>
                        <div class="label-text" id="label3">Grosir 1</div>
                        <div class="display-box" id="val3">RpXXXXXX</div>
                    </div>
                    <div>
                        <div class="label-text" id="label4">Grosir 2</div>
                        <div class="display-box" id="val4">RpXXXXXX</div>
                    </div>
                </div>

                <div class="sku-tag" id="pCode">SCAN CODE: -</div>
            </div>
        </div>
    </div>
</div>

<div class="floating-footer">
    TGOS HELPER © ALL RIGHTS RESERVED 2026
</div>

<script>
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQqFjmQEMLJl-UhiBkV6hDmVePKMGhWgUkwqPWiUOcv6YeBjX9-mw75au_WztJIkcbwr0D2hcDAGZrw/pub?gid=0&single=true&output=csv";
    
    let inventoryData = [];

    function initApp() {
        Papa.parse(CSV_URL, {
            download: true,
            header: false, 
            skipEmptyLines: true,
            complete: function(results) {
                inventoryData = results.data.slice(1);
                const statusBadge = document.getElementById('status');
                statusBadge.innerText = "✅ DATABASE POS ONLINE: " + inventoryData.length + " ITEM";
                statusBadge.classList.remove('offline');
            },
            error: function() {
                const statusBadge = document.getElementById('status');
                statusBadge.innerText = "❌ GAGAL SINKRONISASI DATABASE";
                statusBadge.classList.add('offline');
            }
        });
    }

    const inputField = document.getElementById('scanInput');
    const displayArea = document.getElementById('resultDisplay');
    const idleMsg = document.getElementById('idleMsg');
    const manualBtn = document.getElementById('manualScanBtn');
    
    // Variabel untuk Search Manual
    const nameSearch = document.getElementById('nameSearch');
    const dropdown = document.getElementById('dropdownList');

    // LOGIKA SEARCH BARANG MANUAL
    nameSearch.addEventListener('input', function() {
        const val = this.value.toLowerCase().trim();
        dropdown.innerHTML = '';
        
        if (!val) {
            dropdown.style.display = 'none';
            return;
        }
        
        // Filter array data berdasarkan Kolom C (Nama Produk, Index [2])
        // Ambil maksimal 6 hasil saja agar dropdown tidak kepanjangan
        const matches = inventoryData.filter(row => row[2] && row[2].toLowerCase().includes(val)).slice(0, 6);
        
        if (matches.length > 0) {
            dropdown.style.display = 'block';
            matches.forEach(match => {
                const div = document.createElement('div');
                div.className = 'dropdown-item';
                div.innerText = match[2]; // Tampilkan nama barang
                
                div.onclick = () => {
                    // Coba ambil kode tunggal dulu, kalau tidak ada pakai kode jamak
                    const targetBarcode = String(match[4] || match[3] || '').trim();
                    if(targetBarcode) {
                        searchProduct(targetBarcode);
                    } else {
                        alert("Maaf, barang ini belum memiliki barcode di database!");
                    }
                    // Reset kolom pencarian setelah diklik
                    nameSearch.value = '';
                    dropdown.style.display = 'none';
                };
                dropdown.appendChild(div);
            });
        } else {
            dropdown.style.display = 'none';
        }
    });

    // Menutup dropdown kalau user klik di luar area
    document.addEventListener('click', function(e) {
        if(e.target !== nameSearch && !e.target.classList.contains('dropdown-item')) {
            dropdown.style.display = 'none';
        }
    });

    // SISTEM SCAN BARCODE
    inputField.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            e.preventDefault();
            processScan();
        }
    });

    manualBtn.addEventListener('click', () => {
        processScan();
    });

    function processScan() {
        const barcodeVal = inputField.value.trim();
        if (barcodeVal) {
            searchProduct(barcodeVal);
        }
        inputField.value = '';
    }

    function searchProduct(barcode) {
        if (inventoryData.length === 0) {
            alert("Database sedang memuat data, mohon tunggu.");
            return;
        }

        const productRow = inventoryData.find(row => 
            (row[3] && String(row[3]).trim() === barcode) || 
            (row[4] && String(row[4]).trim() === barcode)
        );

        if (productRow) {
            idleMsg.style.display = 'none';
            displayArea.style.display = 'block';
            
            document.getElementById('pName').innerText = productRow[2];
            document.getElementById('pCode').innerText = "KODE BARCODE: " + barcode;

            const isJamak = productRow[3] && String(productRow[3]).trim() === barcode;

            removeHighlights();

            if (isJamak) {
                fillPrice("Grosir 1", productRow[6], "Grosir 2", productRow[8], "Eceran 1", productRow[10], "Eceran 2", productRow[12]);
                document.getElementById('val1').parentElement.classList.add('active-scan');
                document.getElementById('val2').parentElement.classList.add('active-scan');
            } else {
                fillPrice("Eceran 1", productRow[10], "Eceran 2", productRow[12], "Grosir 1", productRow[6], "Grosir 2", productRow[8]);
                document.getElementById('val1').parentElement.classList.add('active-scan');
                document.getElementById('val2').parentElement.classList.add('active-scan');
            }
        } else {
            alert("Kode (" + barcode + ") tidak terdaftar di database Toko Faster.");
        }
    }

    function fillPrice(l1, v1, l2, v2, l3, v3, l4, v4) {
        document.getElementById('label1').innerText = l1;
        document.getElementById('val1').innerText = formatRupiah(v1);
        document.getElementById('label2').innerText = l2;
        document.getElementById('val2').innerText = formatRupiah(v2);
        document.getElementById('label3').innerText = l3;
        document.getElementById('val3').innerText = formatRupiah(v3);
        document.getElementById('label4').innerText = l4;
        document.getElementById('val4').innerText = formatRupiah(v4);
    }

    function removeHighlights() {
        const boxes = document.querySelectorAll('.display-box');
        boxes.forEach(box => box.classList.remove('active-scan'));
    }

    function formatRupiah(angka) {
        if (angka === undefined || angka === null || angka === "") return "Rp-";
        let strAngka = String(angka).replace(/[^0-9]/g, '');
        if (!strAngka) return "Rp0";
        return "Rp" + strAngka.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    }

    // PERBAIKAN AUTO-FOCUS LOCK:
    // Mencegah kursor lompat ke scanner box saat user sedang klik kolom search manual
    document.addEventListener('click', (e) => {
        if(e.target !== manualBtn && e.target !== nameSearch && !e.target.classList.contains('dropdown-item')) {
            inputField.focus();
        }
    });
    
    initApp();
</script>

</body>
</html>
